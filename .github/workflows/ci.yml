name: CI Test Matrix & Environment Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        # Python 3.14 is experimental; runs in separate allow-failure job if needed
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run fast test suite
        run: |
          pytest -q -k "not test_18_end_to_end_runner_quick_mode"

      - name: Run End-to-End Comparison Test
        run: |
          pytest -q tests/test_part9_comparison.py::test_18_end_to_end_runner_quick_mode
